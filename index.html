<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Week — Family Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF3ED; --surface: #FFFFFF; --surface-2: #F7FAF6; --ink: #1F2A24; --ink-soft: #5B6960; --line: #DCE5DC;
    --marigold: #E8A33D; --marigold-ink: #7A4E12; --sage: #4E7B6D; --sage-deep: #34544A;
    --coral: #E8735F; --plum: #8B5FBF; --teal: #3E9B8C; --sky: #4A90C2; --danger: #C4523F;
    --berry: #B0475A; --olive: #7A8B4E; --indigo: #5A6FB0; --amber: #C98A2B; --slate: #55707A;
    --radius-lg: 22px; --radius-md: 14px; --radius-sm: 9px;
    --shadow: 0 2px 0 rgba(31,42,36,0.06), 0 10px 24px rgba(31,42,36,0.06);
  }
  *{box-sizing:border-box;}
  html{ transition: filter 1.2s ease; touch-action: manipulation; }
  html,body{height:100%;}
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: 'Figtree', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x:hidden; }
  h1,h2,h3, .display{ font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }
  button{ font-family: inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, select{ font-family: inherit; font-size: inherit; }
  #zoomWrapper{ transform-origin: top left; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 18px 24px 12px 24px; gap: 12px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:baseline; gap:14px; }
  .brand h1{ font-size: 30px; margin:0; color: var(--sage-deep); }
  .brand .today{ font-size: 16px; color: var(--ink-soft); font-weight: 500; }
  .tabs{ display:flex; background: var(--surface); border-radius: 999px; padding: 5px; box-shadow: var(--shadow); gap: 4px; flex-wrap:wrap; }
  .tabs button{ min-height:52px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 16px; color: var(--ink-soft); transition: background .18s ease, color .18s ease; white-space:nowrap; }
  .tabs button.active{ background: var(--sage-deep); color: #fff; }
  .topbar-actions{ display:flex; gap:10px; align-items:center; }
  .icon-btn{ height:52px; min-width:52px; display:flex; align-items:center; justify-content:center; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-size:19px; flex-shrink:0; padding:0 14px; font-weight:700; gap:6px; }
  .icon-btn:active{ transform: scale(0.94); }
  .icon-btn .lbl{ font-size:14px; font-weight:800; color: var(--sage-deep); }

  main{ padding: 6px 24px 40px 24px; }

  /* Today tab */
  .weather-card{ display:flex; align-items:center; gap:14px; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 20px; margin-bottom:14px; }
  .weather-icon{ font-size:34px; line-height:1; }
  .weather-temp{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .weather-desc{ font-size:15px; color: var(--ink-soft); font-weight:600; }
  .weather-place{ font-size:14px; color: var(--ink-soft); }
  .today-events-strip{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .today-event-card{ background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 16px 20px; display:flex; align-items:flex-start; gap:16px; }
  .today-event-icon{ font-size:30px; line-height:1; margin-top:2px; }
  .today-event-title{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin-bottom:4px; }
  .today-event-sub{ font-size:15px; color: var(--ink-soft); font-weight:600; display:flex; gap:6px 12px; flex-wrap:wrap; align-items:center; }
  .today-event-sub span{ white-space:nowrap; }
  .map-link{ color: var(--sage-deep); text-decoration:none; font-weight:800; font-size:14px; background: var(--surface-2); padding:0 14px; min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; white-space:nowrap; vertical-align:middle; }
  .an-section-title{ font-family:'Fraunces',serif; font-size:21px; color: var(--sage-deep); margin: 18px 0 14px 0; }
  .today-head{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .today-head-date{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; color: var(--sage-deep); }
  .today-clock{ font-family:'Fraunces',serif; font-weight:600; font-size:34px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right:auto; }
  .add-big{ min-height:56px; padding: 0 26px; border-radius:999px; background: var(--sage-deep); color:#fff; font-weight:800; font-size:18px; box-shadow: var(--shadow); white-space:nowrap; }
  .add-big:active{ transform: scale(0.97); }
  .upnext-card{ background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom:14px; display:flex; align-items:center; gap:16px; border-left: 8px solid var(--marigold); }
  .upnext-kicker{ font-size:14px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color: var(--marigold-ink); margin-bottom:2px; }
  .upnext-title{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; }
  .upnext-sub{ font-size:16px; font-weight:600; color: var(--ink-soft); }
  .today-people{ display:flex; flex-direction:column; gap:10px; }
  .tp-row{ display:flex; align-items:center; gap:16px; width:100%; min-height:80px; padding: 14px 18px; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius-lg); text-align:left; }
  .tp-row:active{ transform: scale(0.99); }
  .tp-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .tp-top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .tp-name{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; }
  .tp-count{ font-size:17px; font-weight:700; color: var(--ink-soft); }
  .tp-count b{ color: var(--ink); font-weight:800; }
  .tp-track{ height:14px; background: var(--surface-2); border-radius:999px; overflow:hidden; }
  .tp-fill{ height:100%; border-radius:999px; transition: width .3s ease; }
  .tp-dots{ display:flex; gap:8px; flex-wrap:wrap; }
  .tsc-dot{ width:28px; height:28px; border-radius:50%; border:2.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fff; }
  .tsc-dot.done{ background:#3FA76B; border-color:#3FA76B; }
  .tsc-dot svg{ width:16px; height:16px; }
  .tp-go{ font-size:28px; color: var(--ink-soft); flex-shrink:0; }

  /* Tasklist */
  .chore-board{ display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; overflow-x:auto; padding-bottom: 8px; }
  .person-col{ background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); display:flex; flex-direction:column; min-height: 360px; overflow:hidden; position:relative; transition: box-shadow .3s ease; }
  .person-col.flash{ box-shadow: 0 0 0 4px var(--marigold), var(--shadow); }
  .person-col.celebrating{ animation: colPop .6s ease; }
  @keyframes colPop{ 0%{transform:scale(1);} 40%{transform:scale(1.025);} 100%{transform:scale(1);} }
  .person-head{ padding: 16px 16px 14px 16px; display:flex; flex-direction:column; gap:10px; border-bottom: 1px solid var(--line); }
  .person-name-row{ display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .person-name-left{ display:flex; align-items:center; gap:10px; min-height:52px; min-width:44px; text-align:left; border-radius: var(--radius-md); }
  .person-name{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
  .points-badge{ font-size:14px; font-weight:800; color: var(--marigold-ink); background:#FBF0DC; padding:5px 10px; border-radius:999px; white-space:nowrap; }
  .progress-track{ height:12px; background: var(--surface-2); border-radius: 999px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:999px; transition: width .3s ease; }
  .progress-label{ font-size:15px; color: var(--ink-soft); font-weight:600; }
  .chore-list{ flex:1; padding: 10px 12px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .chore-row{ display:grid; grid-template-columns: 44px minmax(0,1fr) auto; grid-template-areas: "check title title" "check pts acts"; align-items:center; column-gap:12px; row-gap:2px; min-height:72px; padding: 10px 6px 4px 12px; border-radius: var(--radius-md); background: var(--surface-2); transition: background .15s ease; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .chore-row:active{ background: var(--line); }
  .chore-row.done{ background: transparent; }
  .chore-row.done .chore-title, .chore-row.done .chore-points{ opacity:0.55; }
  .checkbox{ grid-area: check; width:44px;height:44px; border-radius:50%; border: 3px solid var(--line); flex-shrink:0; display:flex;align-items:center;justify-content:center; background:#fff; transition: all .15s ease; }
  .checkbox.checked{ background: var(--sage-deep); border-color: var(--sage-deep); }
  .checkbox svg{ width:24px;height:24px; opacity:0; transition: opacity .1s; }
  .checkbox.checked svg{ opacity:1; }
  .chore-title{ grid-area: title; font-size:19px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; padding-right:6px; }
  .chore-points{ grid-area: pts; font-size:14px; font-weight:800; color: var(--marigold-ink); }
  .chore-acts{ grid-area: acts; display:flex; }
  .chore-row.done .chore-title{ text-decoration: line-through; text-decoration-color: var(--ink-soft); }
  .chore-row.skipped-row{ display:flex; cursor:default; opacity:0.6; border:1.5px dashed var(--line); padding: 8px 6px 8px 14px; }
  .chore-del{ font-size: 18px; color: var(--ink-soft); width:44px;height:44px; min-width:44px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .chore-del:active{ background: var(--line); }
  .empty-note{ padding: 24px 12px; text-align:center; color: var(--ink-soft); font-size:14px; line-height:1.5; }
  .add-chore-btn{ margin: 4px 12px 12px 12px; min-height:56px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--sage-deep); font-weight:800; font-size:17px; border: 1.5px dashed var(--line); }
  .add-chore-btn:active{ background: var(--line); }
  .goal-box{ margin: 0 12px 14px 12px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--radius-md); }
  .goal-label{ font-size:14px; font-weight:700; color: var(--ink-soft); margin-bottom:6px; }
  .goal-track{ height:12px; background:#fff; border-radius:999px; overflow:hidden; }
  .goal-fill{ height:100%; border-radius:999px; background: var(--marigold); }

  /* Calendar */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; flex-wrap:wrap; gap:10px; }
  .cal-header h2{ font-size: 26px; margin:0; color: var(--sage-deep); }
  .cal-nav{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .cal-nav button{ background: var(--surface); box-shadow: var(--shadow); width:48px;height:48px; border-radius:999px; font-size:22px; }
  .cal-nav .add-big{ width:auto; height:auto; min-height:56px; background: var(--sage-deep); font-size:18px; padding: 0 26px; margin-left:6px; }
  .today-btn{ width:auto !important; padding: 0 18px !important; font-weight:700; font-size:16px !important; color: var(--sage-deep); }
  .cal-legend{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .cal-legend span{ font-size:14px; font-weight:700; color: var(--ink-soft); background: var(--surface); padding:6px 10px; border-radius:999px; box-shadow: var(--shadow); }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .dp-dow-row{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:4px; }
  .dp-dow{ text-align:center; font-size:14px; font-weight:700; color:var(--ink-soft); }
  .dp-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .dp-cell{ aspect-ratio:1; min-width:44px; min-height:44px; border-radius:10px; background:var(--surface-2); font-weight:700; font-size:15px; overflow:hidden; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .dp-cell.other-month{ opacity:0.3; }
  .dp-cell.today{ box-shadow: inset 0 0 0 2px var(--marigold); }
  .dp-cell.selected{ background:var(--sage-deep); color:#fff; }
  .pc-cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:15px; font-weight:700; gap:1px; }
  .pc-cell.pc-perfect{ background:#FBF0DC; box-shadow: inset 0 0 0 2px var(--marigold); }
  .cal-dow{ text-align:center; font-size:14px; font-weight:700; color: var(--ink-soft); padding-bottom:4px; letter-spacing: 0.02em; }
  .cal-cell{ background: var(--surface); border-radius: var(--radius-md); min-height: 104px; cursor:pointer; min-width:0; padding: 8px; box-shadow: var(--shadow); display:flex; flex-direction:column; gap:5px; position:relative; overflow:hidden; }
  .cal-cell.other-month{ opacity: 0.35; }
  .cal-cell.today{ box-shadow: inset 0 0 0 2px var(--marigold), var(--shadow); }
  .cal-daynum{ font-weight:800; font-size:17px; }
  .cal-people-row{ display:flex; gap:3px; flex-wrap:wrap; }
  .cal-people-dot{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#fff; flex-shrink:0; }
  .cal-people-dot svg{ width:14px; height:14px; }
  .cal-events{ display:flex; flex-direction:column; gap:3px; }
  .cal-event-chip{ font-size:14px; font-weight:700; color:#fff; padding: 3px 6px; border-radius: 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-more{ font-size:14px; color: var(--ink-soft); font-weight:600; }

  /* Modal */
  .modal-backdrop{ position:fixed; inset:0; background: rgba(31,42,36,0.45); display:flex; align-items:center; justify-content:center; z-index: 100; padding: 20px; }
  .modal{ background: var(--surface); border-radius: var(--radius-lg); max-width: 560px; width:100%; max-height: 86vh; overflow-y:auto; padding: 26px; }
  .modal h3{ margin: 0 0 18px 0; font-size:22px; color: var(--sage-deep); }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:15px; font-weight:700; color: var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=time], .field input[type=date], .field input[type=number], .field select{ width:100%; min-height:48px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--surface-2); font-size:17px; color: var(--ink); }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{ min-height:48px; padding: 0 18px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); font-size:16px; font-weight:700; color: var(--ink-soft); }
  .chip.on{ background: var(--sage-deep); border-color: var(--sage-deep); color:#fff; }
  .day-picker{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .day-picker button{ width:44px;height:44px; border-radius:999px; background: var(--surface-2); border: 2px solid var(--line); font-weight:800; font-size:15px; color: var(--ink-soft); }
  .day-picker button.on{ background: var(--marigold); border-color: var(--marigold); color:#fff; }
  .person-picker{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .person-chip{ display:flex; align-items:center; gap:8px; min-height:48px; padding: 6px 16px 6px 8px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); font-size:16px; font-weight:700; color: var(--ink-soft); }
  .person-chip.on{ background: var(--sage-deep); border-color: var(--sage-deep); color:#fff; }
  .emoji-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .emoji-strip button{ width:52px; height:52px; border-radius: var(--radius-md); background: var(--surface-2); border: 2px solid var(--line); font-size:26px; line-height:1; }
  .emoji-strip button:active{ background: var(--line); }
  .more-toggle{ display:flex; align-items:center; gap:10px; width:100%; min-height:52px; padding: 0 16px; border-radius: var(--radius-md); background: var(--surface-2); border: 1.5px dashed var(--line); font-size:16px; font-weight:800; color: var(--sage-deep); margin-bottom:14px; }
  .more-toggle .caret{ display:inline-block; margin-left:auto; transition: transform .2s ease; }
  .more-toggle.open .caret{ transform: rotate(180deg); }
  .more-panel{ padding: 4px 0 2px 0; }
  .field-hint{ font-size:14px; color: var(--ink-soft); font-weight:600; margin-top:6px; }
  .modal-actions{ display:flex; gap:10px; margin-top: 22px; }
  .btn{ flex:1; min-height:52px; padding: 0 16px; border-radius: var(--radius-md); font-weight:700; font-size:17px; }
  .btn-big{ min-height:60px; font-size:19px; font-weight:800; }
  .btn-primary{ background: var(--sage-deep); color:#fff; }
  .btn-secondary{ background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); }
  .btn:active{ transform: scale(0.98); }
  .checkbox-row{ display:flex; align-items:center; gap:10px; }
  .checkbox-row input[type=checkbox]{ width:44px; height:44px; margin:0; flex-shrink:0; accent-color: var(--sage-deep); }

  .settings-people{ display:flex; flex-direction:column; gap:14px; margin-bottom: 22px; }
  .settings-person-row{ display:flex; align-items:center; gap:12px; }
  .settings-person-row input{ flex:1; min-width:0; min-height:48px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--surface-2); font-size:15px; font-weight:600; }
  .photo-btn{ font-size:15px; font-weight:700; color: var(--sage-deep); background: var(--surface-2); min-height:48px; padding:0 14px; border-radius: 999px; border:1.5px solid var(--line); white-space:nowrap; }
  .divider{ height:1px; background: var(--line); margin: 20px 0; }
  .day-events-list{ display:flex; flex-direction:column; gap:10px; margin-bottom: 18px; }
  .day-event-row{ display:flex; align-items:center; gap:8px; padding: 6px 6px 6px 14px; min-height:60px; background: var(--surface-2); border-radius: var(--radius-md); }
  .day-event-icon{ font-size:22px; flex-shrink:0; }
  .day-event-info{ flex:1; min-width:0; }
  .day-event-title{ font-weight:700; font-size:17px; }
  .day-event-time{ font-size:14px; color: var(--ink-soft); }
  .day-event-del{ color: var(--ink-soft); font-size:18px; width:44px; height:44px; min-width:44px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .day-event-del:active{ background: var(--line); }
  .backup-row{ display:flex; gap:10px; }
  .goal-settings-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .goal-settings-row .gname{ width:100px; flex-shrink:0; font-weight:700; font-size:15px; }
  .goal-settings-row input[type=number]{ width:84px; min-height:48px; font-size:16px; padding:9px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--surface-2); }
  .goal-settings-row input[type=text]{ flex:1; min-width:0; min-height:48px; font-size:16px; padding:9px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--surface-2); }

  /* Analytics */
  .an-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .an-period-tabs{ display:flex; background: var(--surface); border-radius: 999px; padding:5px; box-shadow: var(--shadow); }
  .an-period-tabs button{ min-height:48px; padding: 0 18px; border-radius:999px; font-weight:700; font-size:16px; color: var(--ink-soft); }
  .an-period-tabs button.active{ background: var(--marigold); color:#fff; }
  .an-cards{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-bottom:22px; }
  .an-card{ background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding:18px; }
  .an-card-name{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .an-stat-row{ display:flex; justify-content:space-between; font-size:15px; color: var(--ink-soft); margin-bottom:4px; font-weight:600; }
  .an-stat-row b{ color: var(--ink); font-weight:800; }
  .an-panel{ background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding:20px; margin-bottom:20px; overflow-x:auto; }
  .an-leader-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .an-leader-name{ width:120px; font-weight:700; font-size:16px; flex-shrink:0; }
  .an-leader-track{ flex:1; height:28px; background: var(--surface-2); border-radius:999px; overflow:hidden; }
  .an-leader-fill{ height:100%; border-radius:999px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
  .an-leader-fill span{ font-size:14px; font-weight:800; color:#fff; }

  .alert-backdrop{ position:fixed; inset:0; background: rgba(31,42,36,0.55); display:flex; align-items:center; justify-content:center; z-index: 200; padding:20px; }
  .alert-box{ background: var(--marigold); color:#fff; border-radius: var(--radius-lg); padding: 32px; max-width: 420px; width:100%; text-align:center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
  .alert-box h3{ font-size:26px; margin: 0 0 8px 0; color:#fff; }
  .alert-box p{ font-size:16px; margin:0 0 22px 0; opacity:0.95; }
  .alert-box button{ background:#fff; color: var(--marigold-ink); min-height:56px; padding: 0 34px; border-radius: 999px; font-weight:800; font-size:18px; }

  .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:250; display:flex; align-items:center; gap:16px; background: var(--ink); color:#fff; padding: 10px 10px 10px 22px; border-radius:999px; box-shadow: 0 14px 34px rgba(0,0,0,0.25); font-size:17px; font-weight:600; max-width: calc(100vw - 32px); animation: toastIn .2s ease; }
  .toast-msg{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .toast button{ min-height:52px; min-width:88px; padding: 0 22px; border-radius:999px; background: var(--marigold); color:#fff; font-weight:800; font-size:18px; flex-shrink:0; }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%, 12px); } to{ opacity:1; transform:translate(-50%, 0); } }
  .celebrate-layer{ position:fixed; pointer-events:none; z-index:150; overflow:visible; }
  .celebrate-layer span{ position:absolute; font-size:30px; line-height:1; will-change: transform, opacity; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div id="zoomWrapper">
  <div class="topbar">
    <div class="brand">
      <h1>Our Week</h1>
      <div class="today" id="todayLabel"></div>
    </div>
    <div class="tabs">
      <button id="tabToday" class="active">Today</button>
      <button id="tabChores">Tasklist</button>
      <button id="tabCalendar">Calendar</button>
      <button id="tabAnalytics">Analytics</button>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="zoomToggle" title="Zoom">🔍<span class="lbl" id="zoomLbl">Normal</span></button>
      <button class="icon-btn" id="openSettings" title="Settings">⚙️</button>
    </div>
  </div>

  <main>
    <div id="todayView">
      <div class="today-head">
        <div class="today-head-date" id="todayHeadDate"></div>
        <div class="today-clock" id="todayClock"></div>
        <button class="add-big" id="todayAddEvent">+ Add event</button>
      </div>
      <div class="weather-card" id="weatherCard" style="display:none;"></div>
      <div class="upnext-card" id="upNextCard" style="display:none;"></div>
      <div class="today-events-strip" id="todayEventsStrip"></div>
      <div class="an-section-title">Tasks left today</div>
      <div class="today-people" id="todaySummaryList"></div>
    </div>
    <div id="choresView" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
        <div class="cal-nav">
          <button id="taskPrevDay">‹</button>
          <button class="today-btn" id="taskTodayBtn" style="min-width:180px;"></button>
          <button id="taskNextDay">›</button>
        </div>
        <button class="icon-btn" id="toggleSkippedBtn" title="Show/hide skipped tasks" style="color:var(--ink-soft);"></button>
      </div>
      <div class="chore-board" id="choreBoard"></div>
    </div>
    <div id="calendarView" style="display:none;">
      <div class="cal-header">
        <h2 id="calMonthLabel"></h2>
        <div class="cal-nav">
          <button id="calPrev">‹</button>
          <button class="today-btn" id="calToday">Today</button>
          <button id="calNext">›</button>
          <button class="icon-btn" id="calStarsToggle" title="Show/hide daily stars" style="color:var(--ink-soft);"></button>
          <button class="add-big" id="calAddEvent">+ Add</button>
        </div>
      </div>
      <div class="cal-legend" id="calLegend"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div id="analyticsView" style="display:none;"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="alertRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "family-board-data-v1";
  var PERSON_COLORS = ["--coral","--marigold","--teal","--plum","--sky","--berry","--olive","--indigo","--amber","--slate"];
  var DOW_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var DOW_SHORT = ["S","M","T","W","T","F","S"];
  var MONTH_LABELS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var ZOOM_FACTORS = [1, 0.9, 1.3];
  var ZOOM_LABELS = ["Normal","Small","Large"];

  var CATEGORIES = {
    other:        { icon:"📌", label:"Event",       tint:"#EEF3ED" },
    birthday:     { icon:"🎂", label:"Birthday",     tint:"#FBEAE6" },
    holiday:      { icon:"🎉", label:"Holiday",      tint:"#FDF1DE" },
    vacation:     { icon:"✈️", label:"Vacation",     tint:"#E9F2F8" },
    school_break: { icon:"📚", label:"School Break", tint:"#F1EBF7" }
  };
  var CATEGORY_COLOR_VAR = { other:"--sage-deep", birthday:"--coral", holiday:"--marigold", vacation:"--sky", school_break:"--plum" };
  var COLOR_HEX = { "--coral":"#E8735F","--marigold":"#E8A33D","--teal":"#3E9B8C","--plum":"#8B5FBF","--sky":"#4A90C2","--sage-deep":"#34544A","--berry":"#B0475A","--olive":"#7A8B4E","--indigo":"#5A6FB0","--amber":"#C98A2B","--slate":"#55707A" };

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function todayStr(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function parseDate(s){ return new Date(s + "T00:00:00"); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function colorVar(name){ return "var(" + name + ")"; }
  function initials(name){ return ((name||"?").trim().charAt(0) || "?").toUpperCase(); }

  function makePerson(idx){
    return { id: uid(), name: "Person " + (idx+1), color: PERSON_COLORS[idx % PERSON_COLORS.length], photo: "", rewardGoal: null, dailyGoal: null };
  }
  function defaultData(){
    var people = [];
    for(var i=0;i<5;i++) people.push(makePerson(i));
    return {
      people: people,
      tasks: [], events: [], alertedKeys: [], zoomIndex: 0,
      nightDim: { enabled: false, start: "21:00", end: "07:00" },
      location: { lat: 49.2827, lon: -123.1207, label: "Vancouver, Canada" }
    };
  }

  function migrate(parsed){
    if(!parsed.people || parsed.people.length === 0) return defaultData();
    if(parsed.people.length > 10) parsed.people = parsed.people.slice(0, 10);
    parsed.people.forEach(function(p){
      if(typeof p.photo === "undefined") p.photo = "";
      if(typeof p.rewardGoal === "undefined") p.rewardGoal = null;
      if(typeof p.dailyGoal === "undefined") p.dailyGoal = null;
    });

    if(!parsed.tasks){
      parsed.tasks = (parsed.chores || []).map(function(c){
        var dates = Object.keys(c.completions || {});
        var created = dates.length ? dates.sort()[0] : todayStr();
        return { id: c.id, personId: c.personId, title: c.title, recurrence: c.recurrence, completions: c.completions || {}, createdDate: created, points: 1 };
      });
    }
    parsed.tasks.forEach(function(t, idx){
      if(!t.createdDate) t.createdDate = todayStr();
      if(typeof t.points !== "number") t.points = 1;
      if(typeof t.order !== "number") t.order = idx;
      if(!t.skippedDates) t.skippedDates = {};
    });
    delete parsed.chores;

    if(!parsed.events) parsed.events = [];
    parsed.events.forEach(function(e){
      if(!e.startDate && e.date){ e.startDate = e.date; e.endDate = e.date; }
      if(!e.endDate) e.endDate = e.startDate;
      if(!e.category) e.category = "other";
      if(typeof e.location === "undefined") e.location = "";
      if(typeof e.endTime === "undefined") e.endTime = "";
      if(!e.recurrence) e.recurrence = { type: "none" };
      if(typeof e.recurrenceEnd === "undefined") e.recurrenceEnd = "";
      if(!e.personIds){ e.personIds = e.personId ? [e.personId] : []; }
      delete e.personId;
      delete e.date;
    });

    if(!parsed.alertedKeys) parsed.alertedKeys = [];
    if(typeof parsed.zoomIndex !== "number") parsed.zoomIndex = 0;
    if(!parsed.nightDim) parsed.nightDim = { enabled:false, start:"21:00", end:"07:00" };
    if(!parsed.location) parsed.location = { lat: 49.2827, lon: -123.1207, label: "Vancouver, Canada" };
    return parsed;
  }

  function loadData(){
    try{ var raw = localStorage.getItem(STORAGE_KEY); if(!raw) return defaultData(); return migrate(JSON.parse(raw)); }
    catch(e){ return defaultData(); }
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ alert("Couldn't save — storage may be full (this can happen with too many large photos)."); }
  }

  var state = loadData();
  var currentView = "today";
  var tasklistViewDate = new Date();
  var showSkipped = false;
  var showCalendarStars = false;
  var calMonth = new Date().getMonth();
  var calYear = new Date().getFullYear();
  var anPeriodType = "week";
  var anAnchor = new Date();

  function getPerson(id){ return state.people.find(function(p){ return p.id === id; }) || null; }
  function setPeopleCount(newCount){
    newCount = Math.max(1, Math.min(10, newCount));
    while(state.people.length < newCount){
      state.people.push(makePerson(state.people.length));
    }
    while(state.people.length > newCount){
      var removed = state.people[state.people.length - 1];
      var taskCount = state.tasks.filter(function(t){ return t.personId === removed.id; }).length;
      var msg = 'Remove "' + removed.name + '"' + (taskCount ? " and their " + taskCount + " task" + (taskCount===1?"":"s") : "") + "? This can't be undone.";
      if(!confirm(msg)) return;
      state.people.pop();
      state.tasks = state.tasks.filter(function(t){ return t.personId !== removed.id; });
      state.events.forEach(function(e){ if(e.personIds) e.personIds = e.personIds.filter(function(pid){ return pid !== removed.id; }); });
    }
    saveData();
  }
  function escapeHtml(s){ var div = document.createElement("div"); div.textContent = s; return div.innerHTML; }
  function avatarHtml(person, size){
    if(person.photo){ return '<img src="' + person.photo + '" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:cover;flex-shrink:0;" />'; }
    return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + colorVar(person.color) + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:' + Math.max(14, Math.round(size*0.42)) + 'px;flex-shrink:0;">' + initials(person.name) + '</div>';
  }
  function personNamesForEvent(ev){
    return (ev.personIds || []).map(function(id){ var p = getPerson(id); return p ? p.name : null; }).filter(Boolean).join(", ");
  }

  function isDueOn(task, date){
    var r = task.recurrence;
    if(r.type === "daily") return true;
    if(r.type === "weekly") return r.days.indexOf(date.getDay()) !== -1;
    if(r.type === "monthly") return date.getDate() === r.day;
    if(r.type === "once") return todayStr(date) === r.date;
    if(r.type === "range") return todayStr(date) >= r.start && todayStr(date) <= r.end;
    return false;
  }
  function isActiveDue(task, date, dStr){
    return isDueOn(task, date) && !(task.skippedDates && task.skippedDates[dStr]);
  }
  function recurrenceLabel(r){
    if(r.type === "daily") return "Every day";
    if(r.type === "weekly") return "Weekly: " + r.days.slice().sort().map(function(d){return DOW_LABELS[d];}).join(", ");
    if(r.type === "monthly") return "Monthly on day " + r.day;
    if(r.type === "once") return "Just once — " + parseDate(r.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    if(r.type === "range") return r.start === r.end ? ("Just once — " + parseDate(r.start).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})) : ("Every day, " + parseDate(r.start).toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " – " + parseDate(r.end).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}));
    return "";
  }
  function mapLinksHtml(loc){
    if(!loc) return "";
    var q = encodeURIComponent(loc);
    return ' <a class="map-link" href="https://maps.apple.com/?q=' + q + '" target="_blank" rel="noopener">🍎Maps</a>' +
           ' <a class="map-link" href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" rel="noopener">GMaps</a>';
  }
  function eventTimeLabel(ev){
    if(!ev.time) return "All day";
    return ev.time + (ev.endTime ? "–" + ev.endTime : "");
  }
  function eventRecurrenceNote(ev){
    var r = ev.recurrence || {type:"none"};
    if(r.type === "none") return ev.startDate !== ev.endDate ? (parseDate(ev.startDate).toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " – " + parseDate(ev.endDate).toLocaleDateString(undefined,{month:"short",day:"numeric"})) : eventTimeLabel(ev);
    var base = r.type === "weekly" ? ("Weekly: " + r.days.slice().sort().map(function(d){return DOW_LABELS[d];}).join(", ")) : ("Monthly on day " + r.day);
    if(ev.time) base += " · " + eventTimeLabel(ev);
    if(ev.recurrenceEnd) base += " (until " + parseDate(ev.recurrenceEnd).toLocaleDateString(undefined,{month:"short",day:"numeric"}) + ")";
    return base;
  }

  function pointsForPersonToday(personId, tStr){
    var total = 0;
    state.tasks.filter(function(t){ return t.personId === personId; }).forEach(function(t){ if(t.completions[tStr]) total += (t.points || 1); });
    return total;
  }
  function totalPointsAllTime(personId){
    var total = 0;
    state.tasks.filter(function(t){ return t.personId === personId; }).forEach(function(t){
      Object.keys(t.completions).forEach(function(dateKey){ if(t.completions[dateKey]) total += (t.points || 1); });
    });
    return total;
  }
  function personDayStats(personId, dateObj, dateStr){
    var tasks = state.tasks.filter(function(t){ return t.personId === personId && t.createdDate <= dateStr; });
    var due = tasks.filter(function(t){ return isActiveDue(t, dateObj, dateStr); });
    var completed = due.filter(function(t){ return t.completions[dateStr]; }).length;
    return { due: due.length, completed: completed, perfect: due.length > 0 && completed === due.length };
  }
  function checkmarkAndPerfectDayCounts(personId){
    var tasks = state.tasks.filter(function(t){ return t.personId === personId; });
    var checkmarks = 0, perfectDays = 0;
    if(tasks.length === 0) return { checkmarks: 0, perfectDays: 0 };
    var earliest = null;
    tasks.forEach(function(t){ var d = parseDate(t.createdDate); if(!earliest || d < earliest) earliest = d; });
    var today = new Date(); today.setHours(0,0,0,0);
    for(var d = new Date(earliest); d <= today; d = addDays(d,1)){
      var dStr = todayStr(d);
      var due = tasks.filter(function(t){ return t.createdDate <= dStr && isActiveDue(t, d, dStr); });
      if(due.length === 0) continue;
      var completedCount = due.filter(function(t){ return t.completions[dStr]; }).length;
      checkmarks += completedCount;
      if(completedCount === due.length) perfectDays++;
    }
    return { checkmarks: checkmarks, perfectDays: perfectDays };
  }

  function applyZoom(){
    var factor = ZOOM_FACTORS[state.zoomIndex];
    var wrapper = document.getElementById("zoomWrapper");
    wrapper.style.width = (100/factor) + "%";
    wrapper.style.transform = "scale(" + factor + ")";
    document.getElementById("zoomLbl").textContent = ZOOM_LABELS[state.zoomIndex];
    requestAnimationFrame(function(){ var rect = wrapper.getBoundingClientRect(); document.body.style.minHeight = rect.height + "px"; });
  }
  document.getElementById("zoomToggle").addEventListener("click", function(){
    state.zoomIndex = (state.zoomIndex + 1) % ZOOM_FACTORS.length;
    saveData(); applyZoom();
  });

  function timeToMinutes(t){ var parts = t.split(":"); return parseInt(parts[0],10)*60 + parseInt(parts[1],10); }
  function checkNightDim(){
    var nd = state.nightDim;
    if(!nd || !nd.enabled){ document.documentElement.style.filter = ""; return; }
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    var startMin = timeToMinutes(nd.start), endMin = timeToMinutes(nd.end);
    var isDim;
    if(startMin === endMin) isDim = false;
    else if(startMin < endMin) isDim = nowMin >= startMin && nowMin < endMin;
    else isDim = nowMin >= startMin || nowMin < endMin;
    document.documentElement.style.filter = isDim ? "brightness(0.55)" : "";
  }

  function renderTopDate(){
    var now = new Date();
    document.getElementById("todayLabel").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  // ---------- Today tab ----------
  function renderTodayStrip(){
    var strip = document.getElementById("todayEventsStrip");
    var todays = eventsOnDate(todayStr());
    if(todays.length === 0){ strip.style.display = "none"; strip.innerHTML = ""; return; }
    strip.style.display = "";
    strip.innerHTML = todays.map(function(ev){
      var names = personNamesForEvent(ev);
      var details = [];
      if(ev.time) details.push('<span>🕐 ' + eventTimeLabel(ev) + '</span>');
      else details.push('<span>All day</span>');
      if(ev.location) details.push('<span>📍 ' + escapeHtml(ev.location) + mapLinksHtml(ev.location) + '</span>');
      if(names) details.push('<span>👤 ' + escapeHtml(names) + '</span>');
      return '<div class="today-event-card">' +
        '<div class="today-event-icon">' + CATEGORIES[ev.category].icon + '</div>' +
        '<div><div class="today-event-title">' + escapeHtml(ev.title) + '</div>' +
        '<div class="today-event-sub">' + details.join("") + '</div></div>' +
      '</div>';
    }).join("");
  }
  function dueTasksFor(personId, dateObj, dStr){
    return state.tasks.filter(function(t){ return t.personId === personId && t.createdDate <= dStr && isActiveDue(t, dateObj, dStr); })
      .sort(function(a,b){ return (a.order||0)-(b.order||0); });
  }
  function renderTodaySummary(){
    var list = document.getElementById("todaySummaryList");
    var today = new Date();
    var tStr = todayStr(today);
    list.innerHTML = state.people.map(function(person){
      var due = dueTasksFor(person.id, today, tStr);
      var doneCount = due.filter(function(t){ return t.completions[tStr]; }).length;
      var pct = due.length ? Math.round(100 * doneCount / due.length) : 0;
      var dots = due.map(function(t){
        var done = !!t.completions[tStr];
        return '<div class="tsc-dot' + (done ? " done" : "") + '">' + (done ? '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : "") + '</div>';
      }).join("");
      var countText = due.length === 0 ? "No tasks today" : (doneCount === due.length ? "All done! 🎉" : "<b>" + doneCount + "</b> of " + due.length + " done");
      return '<button type="button" class="tp-row" data-today-person="' + person.id + '">' +
        avatarHtml(person, 52) +
        '<div class="tp-main">' +
          '<div class="tp-top"><div class="tp-name">' + escapeHtml(person.name) + '</div><div class="tp-count">' + countText + '</div></div>' +
          (due.length ? '<div class="tp-track"><div class="tp-fill" style="width:' + pct + '%;background:' + colorVar(person.color) + ';"></div></div>' : '') +
          (dots ? '<div class="tp-dots">' + dots + '</div>' : '') +
        '</div>' +
        '<div class="tp-go">›</div>' +
      '</button>';
    }).join("");
    list.querySelectorAll("[data-today-person]").forEach(function(btn){
      btn.addEventListener("click", function(){ jumpToPersonColumn(this.getAttribute("data-today-person")); });
    });
  }
  function jumpToPersonColumn(personId){
    tasklistViewDate = new Date();
    setView("chores");
    renderChores();
    var col = document.querySelector('#choreBoard [data-person-col="' + personId + '"]');
    if(!col) return;
    try{ col.scrollIntoView({ behavior:"smooth", block:"center", inline:"center" }); }catch(e){ col.scrollIntoView(); }
    col.classList.add("flash");
    setTimeout(function(){ col.classList.remove("flash"); }, 2200);
  }
  function nowHHMM(){ var n = new Date(); return String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0"); }
  function renderTodayHead(){
    var now = new Date();
    document.getElementById("todayHeadDate").textContent = now.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
    document.getElementById("todayClock").textContent = now.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  }
  function renderUpNext(){
    var card = document.getElementById("upNextCard");
    var now = nowHHMM();
    var next = eventsOnDate(todayStr()).find(function(ev){ return ev.time && ev.time >= now; });
    var kicker = "Up next";
    if(!next){
      next = eventsOnDate(todayStr(addDays(new Date(), 1)))[0];
      kicker = "Tomorrow";
    }
    if(!next){ card.style.display = "none"; card.innerHTML = ""; return; }
    var names = personNamesForEvent(next);
    card.style.display = "flex";
    card.innerHTML =
      '<div class="today-event-icon">' + CATEGORIES[next.category].icon + '</div>' +
      '<div style="min-width:0;"><div class="upnext-kicker">' + kicker + ' · ' + eventTimeLabel(next) + '</div>' +
      '<div class="upnext-title">' + escapeHtml(next.title) + '</div>' +
      (names || next.location ? '<div class="upnext-sub">' + (names ? "👤 " + escapeHtml(names) : "") + (names && next.location ? " · " : "") + (next.location ? "📍 " + escapeHtml(next.location) : "") + '</div>' : '') +
      '</div>';
  }
  var WEATHER_CODES = {
    0:["☀️","Clear sky"], 1:["🌤️","Mostly clear"], 2:["⛅","Partly cloudy"], 3:["☁️","Overcast"],
    45:["🌫️","Foggy"], 48:["🌫️","Foggy"],
    51:["🌦️","Light drizzle"], 53:["🌦️","Drizzle"], 55:["🌦️","Heavy drizzle"],
    61:["🌧️","Light rain"], 63:["🌧️","Rain"], 65:["🌧️","Heavy rain"],

  function fetchWeather(force){
    var now = Date.now();
    if(!force && weatherCache.data && (now - weatherCache.fetchedAt) < 20*60*1000){ renderWeatherCard(); return; }
    var loc = state.location;
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon + "&current=temperature_2m,weather_code&temperature_unit=celsius";
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.timeout = 10000;
    xhr.onload = function(){
      try{
        if(xhr.status >= 200 && xhr.status < 300){
          var data = JSON.parse(xhr.responseText);
          if(data && data.current){
            weatherCache.data = { temp: data.current.temperature_2m, code: data.current.weather_code };
            weatherCache.fetchedAt = now;
            weatherCache.failed = false;
            renderWeatherCard();
            return;

        }
        weatherCache.failed = true;
        renderWeatherCard();
      }catch(e){ weatherCache.failed = true; renderWeatherCard(); }
    };
    xhr.onerror = function(){ weatherCache.failed = true; renderWeatherCard(); };
    xhr.ontimeout = function(){ weatherCache.failed = true; renderWeatherCard(); };

  var suppressClick = false;

    var pressTimer = null, pressStart = null;

    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(evt){ container.addEventListener(evt, cancelPress); });

        chip.className = "cal-event-chip";
        var bg;
        if(ev.personIds && ev.personIds.length === 1 && getPerson(ev.personIds[0])){ bg = colorVar(getPerson(ev.personIds[0]).color); }
        else { bg = colorVar(CATEGORY_COLOR_VAR[ev.category]); }
        chip.style.background = bg;
        chip.textContent = CATEGORIES[ev.category].icon + " " + (ev.time ? eventTimeLabel(ev) + " " : "") + ev.title;
        evWrap.appendChild(chip);
      });
      cell.appendChild(evWrap);
      cell.addEventListener("click", function(){ openDayModal(this.getAttribute("data-date")); });
      grid.appendChild(cell);
    }
    applyZoom();
  }

  // ---------- Shared form bits: repeat chips ----------
  var REPEAT_CHIPS = [["none","Never"],["daily","Every day"],["weekdays","Weekdays"],["weekly","Every week"],["monthly","Monthly"]];
  var TASK_EMOJIS = ["🧹","🦷","🛏️","📚","🍽️","🧺","👕","🐶","🐱","🗑️","🪴","🛁","🎒","🎹","🧸","🚿"];
  function daysKey(days){ return days.slice().sort().join(""); }
  function weeklyChip(days, allDaysIsDaily){
    var k = daysKey(days);
    if(allDaysIsDaily && k === "0123456") return "daily";
    if(k === "12345") return "weekdays";
    if(days.length === 1) return "weekly";
    return "";
  }
  function repeatChipsHtml(groupId, active){
    return '<div class="chip-row" id="' + groupId + '">' + REPEAT_CHIPS.map(function(c){
      return '<button type="button" class="chip' + (c[0] === active ? " on" : "") + '" data-rep="' + c[0] + '">' + c[1] + '</button>';
    }).join("") + '</div>';
  }
  function dayPickerHtml(groupId, days, on){
    return '<div class="day-picker" id="' + groupId + '">' + DOW_SHORT.map(function(lbl, i){
      return '<button type="button" data-day="' + i + '" class="' + (on && days.indexOf(i) !== -1 ? "on" : "") + '" aria-label="' + DOW_LABELS[i] + '">' + lbl + '</button>';
    }).join("") + '</div>';
  }
  function moreToggleHtml(id, open){
    return '<button type="button" class="more-toggle' + (open ? " open" : "") + '" id="' + id + '">More options<span class="caret">▾</span></button>';
  }
  function toggleDay(days, day){ var idx = days.indexOf(day); if(idx === -1) days.push(day); else days.splice(idx,1); }

  // ---------- Task modal ----------
  function openTaskModal(personId, existingTask){
    var baseDate = tasklistViewDate;
    var recurrenceType = existingTask ? existingTask.recurrence.type : "daily";
    var weeklyDays = existingTask && existingTask.recurrence.type === "weekly" ? existingTask.recurrence.days.slice() : [baseDate.getDay()];
    var monthlyDay = existingTask && existingTask.recurrence.type === "monthly" ? existingTask.recurrence.day : baseDate.getDate();
    var isRangeType = existingTask && (existingTask.recurrence.type === "once" || existingTask.recurrence.type === "range");
    var rangeStart = isRangeType ? (existingTask.recurrence.start || existingTask.recurrence.date) : todayStr(baseDate);
    var rangeEnd = isRangeType ? (existingTask.recurrence.end || existingTask.recurrence.date) : todayStr(baseDate);
    if(existingTask && existingTask.recurrence.type === "once") recurrenceType = "range";
    var title = existingTask ? existingTask.title : "";
    var points = existingTask ? (existingTask.points || 1) : 1;
    var selectedPersonId = existingTask ? existingTask.personId : personId;
    var moreOpen = !!(existingTask && (points !== 1 || (recurrenceType === "range" && rangeStart !== rangeEnd)));
    var root = document.getElementById("modalRoot");

    function activeChip(){
      if(recurrenceType === "range") return "none";
      if(recurrenceType === "daily") return "daily";
      if(recurrenceType === "monthly") return "monthly";
      return weeklyChip(weeklyDays, false);
    }
    function sync(){
      var el;
      if((el = document.getElementById("mTaskTitle"))) title = el.value;
      if((el = document.getElementById("mPoints"))) points = parseInt(el.value, 10) || 1;
      if((el = document.getElementById("mMonthlyDay"))) monthlyDay = parseInt(el.value, 10) || 1;
      if((el = document.getElementById("mRangeStart"))) rangeStart = el.value;
      if((el = document.getElementById("mRangeEnd"))) rangeEnd = el.value;
      if(rangeEnd < rangeStart) rangeEnd = rangeStart;
    }
    function build(){
      var person = getPerson(selectedPersonId);
      var personChips = state.people.map(function(p){
        return '<button type="button" class="person-chip' + (p.id === selectedPersonId ? " on" : "") + '" data-pid="' + p.id + '">' + avatarHtml(p, 32) + escapeHtml(p.name) + '</button>';
      }).join("");
      root.innerHTML =
        '<div class="modal-backdrop" id="mBackdrop"><div class="modal">' +
          '<h3>' + (existingTask ? "Edit task" : "New task" + (person ? " for " + escapeHtml(person.name) : "")) + '</h3>' +
          '<div class="field"><label for="mTaskTitle">What needs doing?</label><input type="text" id="mTaskTitle" placeholder="e.g. 🐶 Feed the dog" value="' + escapeHtml(title) + '"/>' +
            '<div class="emoji-strip" id="mEmojiStrip">' + TASK_EMOJIS.map(function(em){ return '<button type="button" data-emoji="' + em + '" aria-label="Add ' + em + '">' + em + '</button>'; }).join("") + '</div>' +
          '</div>' +
          '<div class="field"><label>Who</label><div class="person-picker" id="mPersonPicker">' + personChips + '</div></div>' +
          '<div class="field"><label>Repeat</label>' + repeatChipsHtml("mRepeat", activeChip()) +
            '<div class="field-hint">Or pick days:</div>' + dayPickerHtml("mDays", weeklyDays, recurrenceType === "weekly") +
            (recurrenceType === "monthly" ? '<div class="field" style="margin:12px 0 0 0;"><label for="mMonthlyDay">Day of month</label><input type="number" min="1" max="31" id="mMonthlyDay" value="' + monthlyDay + '"/></div>' : '') +
          '</div>' +
          moreToggleHtml("mMore", moreOpen) +
          '<div class="more-panel" id="mMorePanel"' + (moreOpen ? '' : ' hidden') + '>' +
            '<div class="field"><label for="mPoints">Points</label><input type="number" id="mPoints" min="1" value="' + points + '"/></div>' +
            (recurrenceType === "range" ? '<div class="two-col">' +
              '<div class="field"><label for="mRangeStart">Start date</label><input type="date" id="mRangeStart" value="' + rangeStart + '"/></div>' +
              '<div class="field"><label for="mRangeEnd">End date (same = one day)</label><input type="date" id="mRangeEnd" value="' + rangeEnd + '"/></div>' +
            '</div>' : '') +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" id="mCancel">Cancel</button>' +
            '<button class="btn btn-primary btn-big" id="mSave" style="flex:2;">' + (existingTask ? "Save changes" : "Add task") + '</button>' +
          '</div>' +
        '</div></div>';

      root.querySelectorAll("#mEmojiStrip [data-emoji]").forEach(function(btn){
        btn.addEventListener("click", function(){
          sync();
          var em = this.getAttribute("data-emoji");
          var rest = title.replace(/^\s+/, "");
          TASK_EMOJIS.forEach(function(x){ if(rest.indexOf(x) === 0) rest = rest.slice(x.length).replace(/^\s+/, ""); });
          title = em + " " + rest;
          var inp = document.getElementById("mTaskTitle");
          inp.value = title;
        });
      });
      root.querySelectorAll("#mPersonPicker [data-pid]").forEach(function(btn){
        btn.addEventListener("click", function(){ sync(); selectedPersonId = this.getAttribute("data-pid"); build(); });
      });
      root.querySelectorAll("#mRepeat [data-rep]").forEach(function(btn){
        btn.addEventListener("click", function(){
          sync();
          var rep = this.getAttribute("data-rep");
          if(rep === "none") recurrenceType = "range";
          else if(rep === "daily") recurrenceType = "daily";
          else if(rep === "weekdays"){ recurrenceType = "weekly"; weeklyDays = [1,2,3,4,5]; }
          else if(rep === "weekly"){ recurrenceType = "weekly"; weeklyDays = [baseDate.getDay()]; }
          else if(rep === "monthly") recurrenceType = "monthly";
          build();
        });
      });
      root.querySelectorAll("#mDays [data-day]").forEach(function(btn){
        btn.addEventListener("click", function(){
          sync();
          if(recurrenceType !== "weekly"){ recurrenceType = "weekly"; weeklyDays = []; }
          toggleDay(weeklyDays, parseInt(this.getAttribute("data-day"), 10));
          build();
        });
      });
      document.getElementById("mMore").addEventListener("click", function(){
        moreOpen = !moreOpen;
        this.classList.toggle("open", moreOpen);
        document.getElementById("mMorePanel").hidden = !moreOpen;
      });
      document.getElementById("mCancel").addEventListener("click", closeModal);
      document.getElementById("mBackdrop").addEventListener("click", function(e){ if(e.target.id === "mBackdrop") closeModal(); });
      document.getElementById("mSave").addEventListener("click", function(){
        sync();
        var cleanTitle = title.trim();
        if(!cleanTitle){ document.getElementById("mTaskTitle").focus(); return; }
        var recurrence;
        if(recurrenceType === "weekly"){
          if(weeklyDays.length === 0) weeklyDays = [new Date().getDay()];
          recurrence = { type: "weekly", days: weeklyDays };
        } else if(recurrenceType === "monthly"){
          recurrence = { type: "monthly", day: Math.min(31, Math.max(1, monthlyDay)) };
        } else if(recurrenceType === "range"){
          recurrence = { type: "range", start: rangeStart || todayStr(), end: rangeEnd || rangeStart || todayStr() };
        } else { recurrence = { type: "daily" }; }
        if(existingTask){
          existingTask.title = cleanTitle;
          existingTask.points = points;
          existingTask.recurrence = recurrence;
          if(recurrenceType === "range") existingTask.createdDate = rangeStart;
          if(selectedPersonId !== existingTask.personId && getPerson(selectedPersonId)){
            existingTask.order = state.tasks.filter(function(t){ return t.personId === selectedPersonId; }).reduce(function(m,t){ return Math.max(m, t.order||0); }, -1) + 1;
            existingTask.personId = selectedPersonId;
          }
        } else {
          var maxOrder = state.tasks.filter(function(t){ return t.personId === selectedPersonId; }).reduce(function(m,t){ return Math.max(m, t.order||0); }, -1);
          var createdDate = recurrenceType === "range" ? rangeStart : todayStr();
          state.tasks.push({ id: uid(), personId: selectedPersonId, title: cleanTitle, recurrence: recurrence, completions: {}, skippedDates: {}, createdDate: createdDate, points: points, order: maxOrder + 1 });
        }
        saveData(); closeModal(); refreshTaskViews();
      });
    }
    build();
  }

  function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

  function openPersonCalendarModal(personId){
    var person = getPerson(personId);
    if(!person) return;
    var root = document.getElementById("modalRoot");
    var pMonth = new Date().getMonth();
    var pYear = new Date().getFullYear();

    function build(){
      var firstOfMonth = new Date(pYear, pMonth, 1);

          } else if(s.due > 0){
            content = '<div>' + cellDate.getDate() + '</div><div style="font-size:14px;opacity:0.75;line-height:1;">' + s.completed + '/' + s.due + '</div>';

          '<div class="dp-grid">' + cellsHtml + '</div>' +

        '</div></div>';

      monthlyDay = d.getDate();

  function resizeImage(file, maxDim, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var cw = Math.round(img.width*scale), ch = Math.round(img.height*scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", 0.78));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- Analytics ----------
  function startOfWeek(d){ var r = new Date(d); r.setDate(r.getDate() - r.getDay()); r.setHours(0,0,0,0); return r; }
  function getPeriodRange(type, anchor){
    if(type === "week"){ var s = startOfWeek(anchor); return { start: s, end: addDays(s,6) }; }
    if(type === "month"){ return { start: new Date(anchor.getFullYear(), anchor.getMonth(), 1), end: new Date(anchor.getFullYear(), anchor.getMonth()+1, 0) }; }
    if(type === "year"){ return { start: new Date(anchor.getFullYear(),0,1), end: new Date(anchor.getFullYear(),11,31) }; }
    var earliest = null;
    state.tasks.forEach(function(t){ var d = parseDate(t.createdDate); if(!earliest || d < earliest) earliest = d; });
    state.events.forEach(function(e){ var d = parseDate(e.startDate); if(!earliest || d < earliest) earliest = d; });
    if(!earliest) earliest = new Date();
    return { start: earliest, end: new Date() };
  }
  function periodLabel(type, range){
    if(type === "week") return range.start.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " – " + range.end.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    if(type === "month") return MONTH_LABELS[range.start.getMonth()] + " " + range.start.getFullYear();
    if(type === "year") return String(range.start.getFullYear());
    return "All time (since " + range.start.toLocaleDateString(undefined,{month:"short",year:"numeric"}) + ")";
  }
  function computePersonStats(person, start, end){
    var today = new Date(); today.setHours(0,0,0,0);
    var clampedEnd = end > today ? today : end;
    var due = 0, completed = 0, points = 0;
    var tasks = state.tasks.filter(function(t){ return t.personId === person.id; });
    for(var d = new Date(start); d <= clampedEnd; d = addDays(d,1)){
      var dStr = todayStr(d);
      tasks.forEach(function(t){
        if(t.createdDate > dStr) return;
        if(isActiveDue(t, d, dStr)){ due++; if(t.completions[dStr]){ completed++; points += (t.points||1); } }
      });
    }
    var dayCount = Math.max(1, Math.round((clampedEnd - start)/86400000) + 1);
    return { due: due, completed: completed, points: points, rate: due ? Math.round(100*completed/due) : 0, avgPerDay: (completed/dayCount) };
  }
  function getBuckets(type, range){
    var buckets = [];
    if(type === "week"){ for(var i=0;i<7;i++){ var d = addDays(range.start,i); buckets.push({ label: DOW_SHORT[d.getDay()], start:d, end:d }); } }
    else if(type === "month"){
      var daysInMonth = range.end.getDate();
      for(var i=1;i<=daysInMonth;i++){ var d = new Date(range.start.getFullYear(), range.start.getMonth(), i); buckets.push({ label: String(i), start:d, end:d }); }
    } else if(type === "year"){
      for(var m=0;m<12;m++){ var s = new Date(range.start.getFullYear(), m, 1); var e = new Date(range.start.getFullYear(), m+1, 0); buckets.push({ label: MONTH_SHORT[m], start:s, end:e }); }
    } else {
      var cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
      var endCursor = new Date(range.end.getFullYear(), range.end.getMonth(), 1);
      var all = [];
      while(cursor <= endCursor){
        var s2 = new Date(cursor), e2 = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
        all.push({ label: MONTH_SHORT[cursor.getMonth()] + " '" + String(cursor.getFullYear()).slice(2), start:s2, end:e2 });
        cursor.setMonth(cursor.getMonth()+1);
      }
      buckets = all.slice(-24);
    }
    return buckets;
  }
  function bucketCompletedByPerson(bucket){
    var today = new Date(); today.setHours(0,0,0,0);
    var bEnd = bucket.end > today ? today : bucket.end;
    var result = {};
    state.people.forEach(function(p){ result[p.id] = 0; });
    if(bEnd < bucket.start) return result;
    for(var d = new Date(bucket.start); d <= bEnd; d = addDays(d,1)){
      var dStr = todayStr(d);
      state.tasks.forEach(function(t){
        if(t.createdDate > dStr) return;
        if(isActiveDue(t,d,dStr) && t.completions[dStr]) result[t.personId] = (result[t.personId]||0) + 1;
      });
    }
    return result;
  }

  function renderAnalytics(){
    var view = document.getElementById("analyticsView");
    var range = getPeriodRange(anPeriodType, anAnchor);
    var stats = state.people.map(function(p){ return { person: p, s: computePersonStats(p, range.start, range.end) }; });
    var buckets = getBuckets(anPeriodType, range);
    var bucketData = buckets.map(bucketCompletedByPerson);
    var maxBucketTotal = Math.max(1, Math.max.apply(null, bucketData.map(function(bd){
      return state.people.reduce(function(sum,p){ return sum + (bd[p.id]||0); }, 0);
    })));
    var sortedByRate = stats.slice().sort(function(a,b){ return b.s.rate - a.s.rate; });

    var cardsHtml = stats.map(function(row){
      return '<div class="an-card">' +
        '<div class="an-card-name">' + avatarHtml(row.person, 30) + escapeHtml(row.person.name) + '</div>' +
        '<div class="an-stat-row"><span>Completed</span><b>' + row.s.completed + '</b></div>' +
        '<div class="an-stat-row"><span>Due</span><b>' + row.s.due + '</b></div>' +
        '<div class="an-stat-row"><span>Completion rate</span><b>' + row.s.rate + '%</b></div>' +
        '<div class="an-stat-row"><span>Avg / day</span><b>' + row.s.avgPerDay.toFixed(1) + '</b></div>' +
        '<div class="an-stat-row"><span>Points earned</span><b>⭐ ' + row.s.points + '</b></div>' +
      '</div>';
    }).join("");

    var chartW = Math.max(600, buckets.length * (anPeriodType === "week" ? 34 : 56));
    var chartH = 180;
    var barW = Math.max(6, (chartW / buckets.length) - 8);
    var bars = buckets.map(function(b, i){
      var bd = bucketData[i];
      var x = i * (chartW/buckets.length) + 4;
      var yCursor = chartH - 22;
      var segs = "";
      state.people.forEach(function(p){
        var val = bd[p.id] || 0;
        var h = (val / maxBucketTotal) * (chartH - 30);
        if(h > 0){ yCursor -= h; segs += '<rect x="' + x + '" y="' + yCursor + '" width="' + barW + '" height="' + h + '" fill="' + COLOR_HEX[p.color] + '" rx="2"></rect>'; }
      });
      return segs + '<text x="' + (x + barW/2) + '" y="' + (chartH-6) + '" font-size="14" fill="#5B6960" text-anchor="middle">' + b.label + '</text>';
    }).join("");

    var leaderHtml = sortedByRate.map(function(row){
      return '<div class="an-leader-row">' +
        '<div class="an-leader-name">' + escapeHtml(row.person.name) + '</div>' +
        '<div class="an-leader-track"><div class="an-leader-fill" style="width:' + Math.max(6,row.s.rate) + '%;background:' + colorVar(row.person.color) + ';"><span>' + row.s.rate + '%</span></div></div>' +
      '</div>';
    }).join("");

    view.innerHTML =
      '<div class="an-header">' +
        '<h2 style="font-size:26px;margin:0;color:var(--sage-deep);">' + periodLabel(anPeriodType, range) + '</h2>' +
        '<div class="an-period-tabs" id="anPeriodTabs">' +
          '<button data-p="week">Week</button><button data-p="month">Month</button><button data-p="year">Year</button><button data-p="all">All time</button>' +
        '</div>' +
      '</div>' +
      '<div class="cal-nav" style="margin-bottom:18px;">' +
        '<button id="anPrev">‹</button><button class="today-btn" id="anTodayBtn">Today</button><button id="anNext">›</button>' +
      '</div>' +
      '<div class="an-cards">' + cardsHtml + '</div>' +
      '<div class="an-panel"><div class="an-section-title" style="margin-top:0;">Tasks completed over time</div>' +
        '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" width="100%" height="' + chartH + '" style="min-width:' + chartW + 'px;" preserveAspectRatio="xMinYMid meet">' + bars + '</svg>' +
      '</div>' +
      '<div class="an-panel"><div class="an-section-title" style="margin-top:0;">Comparison — completion rate</div>' + leaderHtml + '</div>';

    view.querySelectorAll("#anPeriodTabs button").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-p") === anPeriodType);
      btn.addEventListener("click", function(){ anPeriodType = this.getAttribute("data-p"); anAnchor = new Date(); renderAnalytics(); });
    });
    var prevBtn = document.getElementById("anPrev"), nextBtn = document.getElementById("anNext");
    if(anPeriodType === "all"){ prevBtn.style.visibility="hidden"; nextBtn.style.visibility="hidden"; } else { prevBtn.style.visibility="visible"; nextBtn.style.visibility="visible"; }
    prevBtn.addEventListener("click", function(){
      if(anPeriodType==="week") anAnchor = addDays(anAnchor,-7);
      else if(anPeriodType==="month") anAnchor = new Date(anAnchor.getFullYear(), anAnchor.getMonth()-1, 1);
      else if(anPeriodType==="year") anAnchor = new Date(anAnchor.getFullYear()-1, 0, 1);
      renderAnalytics();
    });
    nextBtn.addEventListener("click", function(){
      if(anPeriodType==="week") anAnchor = addDays(anAnchor,7);
      else if(anPeriodType==="month") anAnchor = new Date(anAnchor.getFullYear(), anAnchor.getMonth()+1, 1);
      else if(anPeriodType==="year") anAnchor = new Date(anAnchor.getFullYear()+1, 0, 1);
      renderAnalytics();
    });
    document.getElementById("anTodayBtn").addEventListener("click", function(){ anAnchor = new Date(); renderAnalytics(); });
    applyZoom();
  }

  // ---------- Alerts ----------
  function checkEventAlerts(){
    var now = new Date();
    var nowStr = todayStr(now);
    var nowTime = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    eventsOnDate(nowStr).forEach(function(ev){
      if(!ev.time || ev.time !== nowTime) return;
      var key = ev.id + "_" + nowStr + "_" + nowTime;
      if(state.alertedKeys.indexOf(key) !== -1) return;
      state.alertedKeys.push(key);
      if(state.alertedKeys.length > 200) state.alertedKeys = state.alertedKeys.slice(-100);
      saveData();
      showAlert(ev);
    });
  }
  function showAlert(ev){
    var names = personNamesForEvent(ev);
    var root = document.getElementById("alertRoot");
    root.innerHTML = '<div class="alert-backdrop" id="aBackdrop"><div class="alert-box">' +
      '<h3>' + CATEGORIES[ev.category].icon + ' ' + escapeHtml(ev.title) + '</h3>' +
      '<p>' + eventTimeLabel(ev) + (names ? " · " + escapeHtml(names) : "") + '</p>' +
      '<button id="aClose">Got it</button></div></div>';
    document.getElementById("aClose").addEventListener("click", function(){ root.innerHTML = ""; });
  }

  // ---------- Day rollover ----------
  var lastKnownDay = todayStr();
  function checkDayRollover(){
    var t = todayStr();
    if(t !== lastKnownDay){
      lastKnownDay = t;
      renderTopDate(); renderChores(); renderCalendar(); renderToday();
      if(currentView === "analytics") renderAnalytics();
    }
  }

  // ---------- Tabs ----------
  function setView(view){
    currentView = view;
    document.getElementById("todayView").style.display = view === "today" ? "" : "none";
    document.getElementById("choresView").style.display = view === "chores" ? "" : "none";
    document.getElementById("calendarView").style.display = view === "calendar" ? "" : "none";
    document.getElementById("analyticsView").style.display = view === "analytics" ? "" : "none";
    document.getElementById("tabToday").classList.toggle("active", view === "today");
    document.getElementById("tabChores").classList.toggle("active", view === "chores");
    document.getElementById("tabCalendar").classList.toggle("active", view === "calendar");
    document.getElementById("tabAnalytics").classList.toggle("active", view === "analytics");
    if(view === "analytics") renderAnalytics();
    if(view === "today") renderToday();
    applyZoom();
  }
  document.getElementById("tabToday").addEventListener("click", function(){ setView("today"); });
  document.getElementById("tabChores").addEventListener("click", function(){ setView("chores"); });
  document.getElementById("tabCalendar").addEventListener("click", function(){ setView("calendar"); });
  document.getElementById("tabAnalytics").addEventListener("click", function(){ setView("analytics"); });
  document.getElementById("openSettings").addEventListener("click", openSettingsModal);
  document.getElementById("calPrev").addEventListener("click", function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
  document.getElementById("calNext").addEventListener("click", function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); });
  document.getElementById("calAddEvent").addEventListener("click", function(){
    var n = new Date();
    openDayModal(n.getMonth() === calMonth && n.getFullYear() === calYear ? todayStr(n) : todayStr(new Date(calYear, calMonth, 1)));
  });
  document.getElementById("calToday").addEventListener("click", function(){ var n=new Date(); calMonth=n.getMonth(); calYear=n.getFullYear(); renderCalendar(); });

  // ---------- Init ----------
  renderCalLegend();
  renderTopDate();
  renderToday();
  renderChores();
  renderCalendar();
  applyZoom();
  checkNightDim();
  window.addEventListener("resize", applyZoom);
  setInterval(checkEventAlerts, 15000);
  setInterval(checkDayRollover, 15000);
  setInterval(checkNightDim, 30000);
  setInterval(renderTopDate, 60000);
  var lastClockMinute = nowHHMM();
  setInterval(function(){
    var m = nowHHMM();
    if(m === lastClockMinute) return;
    lastClockMinute = m;
    renderTodayHead(); renderUpNext();
  }, 5000);
})();
</script>
<script>
// ---------- Tap guard for Documents by Readdle ----------
// Taps anywhere except the "Our Week" title are handled by the page itself, so the
// Documents toolbar (back button etc.) doesn't pop up. Tapping the title still shows it.
(function(){
  var NATIVE = "input, select, textarea, a, [contenteditable]";
  var start = null;
  document.addEventListener("touchstart", function(e){
    start = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
  }, { passive: true });
  document.addEventListener("touchmove", function(e){
    if(!start) return;
    var t = e.touches[0];
    if(Math.abs(t.clientX - start.x) > 10 || Math.abs(t.clientY - start.y) > 10) start = null; // scrolling
  }, { passive: true });
  document.addEventListener("touchend", function(e){
    if(!start || e.touches.length > 0) return;
    start = null;
    var target = e.target.nodeType === 1 ? e.target : e.target.parentElement;
    if(!target || target.closest(".brand")) return;        // title area: let Documents show its toolbar
    if(target.closest(NATIVE)) return;                      // form fields & links keep normal behavior
    e.preventDefault();                                     // swallow the tap so Documents never sees it
    var active = document.activeElement;
    if(active && active !== document.body && active.matches(NATIVE)) active.blur(); // dismiss keyboard
    var t = e.changedTouches[0];
    target.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window, clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY }));
  }, { passive: false });
})();
</script>
